spring.application.name=portal

# ===== Odoo XML-RPC bridge =============================================
# Конфигурација за OdooClient. Сите вредности се пренесуваат преку
# Docker Compose environment variables (види docker-compose.yml).
odoo.url=${ODOO_URL:http://localhost:8069/xmlrpc/2}
odoo.db=${ODOO_DB:odoo}
odoo.user=${ODOO_USER:admin}
odoo.password=${ODOO_PASSWORD:admin}

# ===== PostgreSQL datasource (MIS Database) ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://backend-db:5432/MIS}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto & SQL Logging
spring.jpa.hibernate.ddl-auto=update
spring.show-sql=true

# Server Port
server.port=8080

# Defer datasource initialization to run data.sql after table creation
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
